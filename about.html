        <script>
            (function(){
                const groups = [
                    {
                        id: 1,
                        name: '锦鲤附体队',
                        slogan: '转发这条锦鲤，好运实力双临',
                        members: ['黄鑫','赵佳怡','王亚楠','王偲潼','王博文']
                    },
                    {
                        id: 2,
                        name: '秃击队',
                        slogan: '聪明绝顶 期末秃击',
                        members: ['韩卿琼','孟繁琪','朱胤合','吴静','杨利腾']
                    },
                    {
                        id: 3,
                        name: '带薪摸鱼队',
                        slogan: '上班摸鱼，下班摸奖',
                        members: ['胡昕','张雨欣','杨明举','童钰博','李锦程']
                    },
                    {
                        id: 4,
                        name: '卷不动但接着学队',
                        slogan: '卷不动也不躺平，稳步向前赢到底！',
                        members: ['汪露垚','朱宇文','孙荣旺','王俊人','林渡']
                    },
                    {
                        id: 5,
                        name: '第一名队',
                        slogan: '第一名，我们来了',
                        members: ['王宇航','赵婧彤','罗美凤','门志慧','王春懿']
                    },
                    {
                        id: 6,
                        name: '码力队',
                        slogan: '码出效率，力破难关',
                        members: ['吴雨凡','王怡雯','王彬宇','余晨阳','伍政名']
                    },
                    {
                        id: 7,
                        name: '不知道叫什么队',
                        slogan: '行到水穷处，坐看云起时，我心无需多言语，相逢何必急相知',
                        members: ['叶张画','梅鸿景','李心玥','李浩洋','高嫣然']
                    },
                    {
                        id: 8,
                        name: '8bit',
                        slogan: '8bit小像素，八组笑嘟嘟',
                        members: ['窦英杰','叶可','贺扬','黄恺辰','姜博涵']
                    }
                ];

                // 优先从 `group/` 文件夹加载小组图片（group/group-{id}.jpg 或 .png）
                let currentGroup = 1;
                const nameEl = document.getElementById('group-name');
                const sloganEl = document.getElementById('group-slogan');
                const membersEl = document.getElementById('group-members');
                const photoEl = document.getElementById('group-photo');
                const prevBtn = document.getElementById('group-prev');
                const nextBtn = document.getElementById('group-next');
                const pagesEl = document.getElementById('group-pages');

                function renderGroup(idx){
                    const g = groups[idx-1];
                    if(!g) return;
                    nameEl.textContent = g.name;
                    sloganEl.textContent = g.slogan;
                    membersEl.innerHTML = '';
                    g.members.forEach(m=>{ const li=document.createElement('li'); li.textContent = m; membersEl.appendChild(li); });

                    // 更新照片：优先加载 image/group-{id}.jpg，若不存在则回退到渐变占位
                    photoEl.innerHTML = '';
                    const imgEl = document.createElement('img');
                    imgEl.alt = `${g.name} 照片`;
                    imgEl.className = 'w-full h-48 md:h-full object-cover rounded-lg';
                    // 依次尝试：group/{id}.jpg -> group/group-{id}.jpg -> group/{id}.png -> group/group-{id}.png
                    const candidates = [
                        `group/${g.id}.jpg`,
                        `group/group-${g.id}.jpg`,
                        `group/${g.id}.png`,
                        `group/group-${g.id}.png`
                    ];
                    let tryIndex = 0;
                    function tryNext(){
                        if(tryIndex >= candidates.length){
                            // 没有可用图片，显示占位
                            photoEl.innerHTML = '';
                            const ph = document.createElement('div');
                            ph.className = 'w-full h-48 md:h-full flex items-center justify-center text-white p-4 rounded-lg bg-gradient-to-br from-primary to-secondary';
                            ph.innerHTML = `<div><div class="text-lg font-semibold">组 ${g.id} 照片占位</div><div class="text-sm opacity-80 mt-1">（无可用图片）</div></div>`;
                            photoEl.appendChild(ph);
                            return;
                        }
                        imgEl.src = candidates[tryIndex];
                        tryIndex++;
                    }

                    imgEl.onerror = function(){ tryNext(); };
                    // start trying
                    tryNext();
                    // append img element (will show and onerror handle missing files)
                    photoEl.appendChild(imgEl);

                    // 更新分页样式
                    pagesEl.innerHTML = '';
                    for(let i=1;i<=groups.length;i++){
                        const btn=document.createElement('button');
                        btn.className = `px-3 py-1 rounded-md text-sm ${i===idx? 'bg-primary text-white':'bg-gray-100 text-gray-700 hover:bg-gray-200'}`;
                        btn.textContent = i;
                        btn.addEventListener('click', ()=>{ currentGroup = i; renderGroup(currentGroup); });
                        pagesEl.appendChild(btn);
                    }

                    prevBtn.disabled = idx===1;
                    nextBtn.disabled = idx===groups.length;
                }

                prevBtn.addEventListener('click', ()=>{ if(currentGroup>1){ currentGroup--; renderGroup(currentGroup); } });
                nextBtn.addEventListener('click', ()=>{ if(currentGroup<groups.length){ currentGroup++; renderGroup(currentGroup); } });

                document.addEventListener('DOMContentLoaded', ()=>{ renderGroup(currentGroup); });
            })();
        </script>

    <script>
        // mobile menu accessibility + body lock
        (function(){ 
            const btn = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            if (btn && mobileMenu) {
                btn.setAttribute('aria-controls','mobile-menu');
                btn.setAttribute('aria-expanded','false');
                btn.addEventListener('click', function() {
                    const open = !mobileMenu.classList.contains('hidden');
                    mobileMenu.classList.toggle('hidden');
                    btn.setAttribute('aria-expanded', String(!open));
                    if (!open) document.body.classList.add('overflow-hidden'); else document.body.classList.remove('overflow-hidden');
                });
                window.addEventListener('resize', function(){ if (window.innerWidth >= 768) { mobileMenu.classList.add('hidden'); btn.setAttribute('aria-expanded','false'); document.body.classList.remove('overflow-hidden'); } });
            }
        })();
    </script>
    
    <!-- 鼠标粒子与点击显示图片（与 index 同步的实现） -->
    <style>

        .cursor-bubble { position: absolute; border-radius: 999px; will-change: transform, opacity; pointer-events: none; mix-blend-mode: screen; }
        .click-image-wrap { position: absolute; pointer-events: none; width:64px; height:64px; border-radius:50%; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.18); transform:translate(-50%,-50%) scale(1); transition: opacity 700ms ease, transform 700ms ease; opacity:1; z-index:10000; background:transparent }
        .click-image-wrap img { display:block; width:100%; height:100%; object-fit:cover; border:none; outline:none; background:transparent }
    </style>
    <!-- 移除图片处理相关代码，简化点击显示图片功能 -->
    <script>
        (function initCursorBubblesAbout(){
            if (document.getElementById('cursor-bubbles')) return; // 防止重复初始化
            const colors = ['rgba(255,77,166,0.95)','rgba(255,153,204,0.88)','rgba(102,178,255,0.9)','rgba(166,102,255,0.9)','rgba(34,197,94,0.9)'];
            const container = document.createElement('div'); container.id = 'cursor-bubbles'; document.body.appendChild(container);
            let lastSpawn = 0; const minInterval = 24;
            function spawnBubble(x,y){
                const el = document.createElement('div'); el.className='cursor-bubble';
                const size = Math.round(Math.random()*10)+6; const color = colors[Math.floor(Math.random()*colors.length)];
                const duration = Math.round(Math.random()*600)+900;
                el.style.left = x+'px'; el.style.top = y+'px'; el.style.width = size+'px'; el.style.height = size+'px'; el.style.background = color; el.style.opacity='1';
                el.style.transition = `transform ${duration}ms cubic-bezier(.2,.9,.3,1), opacity ${duration}ms ease-out`;
                el.style.transform='translate(-50%,-50%) scale(1)'; container.appendChild(el);
                requestAnimationFrame(()=>{ el.style.opacity='0'; el.style.transform='translate(-50%,-70%) scale(0.6)'; });
                setTimeout(()=>{ if(el&&el.parentNode) el.parentNode.removeChild(el); }, duration+60);
            }
            document.addEventListener('mousemove', function(e){ const now = Date.now(); if(now-lastSpawn>minInterval){ spawnBubble(e.clientX,e.clientY); spawnBubble(e.clientX+10,e.clientY+6); lastSpawn=now; } });
            document.addEventListener('touchmove', function(e){ const t=e.touches[0]; if(!t) return; const now=Date.now(); if(now-lastSpawn>minInterval){ spawnBubble(t.clientX,t.clientY); spawnBubble(t.clientX+10,t.clientY+6); lastSpawn=now; } }, {passive:true});

            // 简化的点击显示图片功能
            function showClickImageAtAbout(x,y){
                const wrap = document.createElement('div'); wrap.className='click-image-wrap';
                const img = document.createElement('img'); img.alt = '';
                const vw = Math.max(document.documentElement.clientWidth||0, window.innerWidth||0);
                const size = Math.min(64, Math.round(vw*0.08));
                wrap.style.width = size + 'px'; wrap.style.height = size + 'px';
                wrap.style.left = x + 'px'; wrap.style.top = y + 'px'; wrap.appendChild(img); document.body.appendChild(wrap);
                
                function startFade(){
                    requestAnimationFrame(()=>{ 
                        setTimeout(()=>{ 
                            wrap.style.opacity='0'; 
                            wrap.style.transform='translate(-50%,-70%) scale(1.08)'; 
                        },20); 
                    }); 
                    setTimeout(()=>{ if(wrap&&wrap.parentNode) wrap.parentNode.removeChild(wrap); },820); 
                }
                
                // 直接使用原始图片
                img.src='image/shumei.png';
                startFade();
            }
            
            document.addEventListener('click', function(e){ showClickImageAtAbout(e.clientX,e.clientY); });
            document.addEventListener('touchstart', function(e){ const t=e.touches[0]; if(!t) return; showClickImageAtAbout(t.clientX,t.clientY); }, {passive:true});
        })();
    </script>
    
    <style>
        .click-image-wrap {
            position: absolute;
            pointer-events: none;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(1);
            transition: opacity 700ms ease, transform 700ms ease;

    </style>
    <script>
        // 班级相册轮播逻辑：支持 2000ms 自动播放、object-contain 完整显示图片
        // 使用首尾克隆实现无缝循环；同时将图片框放大以使图片更显眼
        document.addEventListener('DOMContentLoaded', function(){
            const images = [
                'picture/2b73094e1d19699b648ddddb7d45a264.jpg',
                'picture/54f6f194d3168f3bc92e01cf6c820b34.jpg',
                'picture/72c349b7583dbb3f188365426b7bbc79.jpg',
                'picture/b9b8a391df60ebef2cc21cff670bdf8c.jpg',
                'picture/bdbc3d743c46788469682eda93bd7c5a.jpg',
                'picture/cfe8f93b610e0130d4e987d966a51e29.jpg',
                'picture/d0973c46bb5ea1f001a9c9ab4fa925e9.jpg',
                'picture/fc2a04aed398eb1520df4ea890372d1f.jpg'
            ];

            const viewport = document.getElementById('class-slideshow');
            const indicators = document.getElementById('sl-indicators');
            if (!viewport) return;

            // 创建 track 容器（用于无缝循环：前后会插入克隆）
            const track = document.createElement('div');
            track.style.display = 'flex';
            track.style.gap = '8px';
            track.style.alignItems = 'center';
            track.style.height = '100%';
            track.style.transition = 'transform 600ms ease';
            track.style.transition = 'transform 500ms ease';
            track.style.willChange = 'transform';
            viewport.appendChild(track);

            const dots = [];
            const slides = [];
            const realCount = images.length;

            images.forEach((src, i) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.style.flex = '0 0 auto';
                slide.style.height = '100%';
                slide.style.display = 'flex';
                slide.style.alignItems = 'center';
                slide.style.justifyContent = 'center';

                const img = document.createElement('img');
                img.src = src;
                img.alt = `班级照片 ${i+1}`;
                // 优化：延迟加载与异步解码，减轻首次渲染压力
                img.loading = 'lazy';
                img.decoding = 'async';
                img.style.maxWidth = '100%';
                img.style.maxHeight = '100%';
                img.style.objectFit = 'contain';
                img.style.borderRadius = '8px';
                slide.appendChild(img);

                track.appendChild(slide);
                slides.push(slide);

                const dot = document.createElement('button');
                dot.className = 'w-3 h-3 rounded-full bg-white/60 hover:bg-white';
                // dots map to real slides; click should go to index i (0-based)
                dot.addEventListener('click', () => { goToReal(i); resetTimer(); });
                indicators.appendChild(dot);
                dots.push(dot);
            });

            // 为实现无缝循环，克隆末尾与开头的 slide
            const firstClone = slides[0].cloneNode(true);
            const lastClone = slides[slides.length - 1].cloneNode(true);
            track.insertBefore(lastClone, track.firstChild);
            track.appendChild(firstClone);

            let current = 1; // 由于前面插入了一个 clone，真实第一张在索引 1
            let timer = null;
            const autoplayInterval = 2000; // 2000ms
            const gap = 8; // px, matches track gap

            // 计算并设置每个 slide 的宽度（使用视口宽度的比例以便左右邻居可见）
            function layoutSlides(){
                const vw = viewport.clientWidth;
                // slideWidth 取视口的 90%（使图片显得更大）
                const slideWidth = Math.round(vw * 0.9);
                // 所有 slide（包括克隆）都设置相同宽度
                const allSlides = track.querySelectorAll('.slide');
                allSlides.forEach(s => { s.style.width = slideWidth + 'px'; });
                // 将 track translate 以当前 slide 居中
                updatePosition(false);
            }

            function updateIndicators(){
                // 当前真实索引
                const realIdx = ((current - 1) % realCount + realCount) % realCount;
                dots.forEach((d, idx) => {
                    if (idx === realIdx) { d.classList.add('scale-110','bg-white'); } else { d.classList.remove('scale-110','bg-white'); }
                });
            }

            function updatePosition(animate = true){
                const allSlides = track.querySelectorAll('.slide');
                if (!allSlides.length) return;
                const vw = viewport.clientWidth;
                const slideWidth = allSlides[0].clientWidth;
                const totalStep = slideWidth + gap;
                const offset = Math.round((vw - slideWidth) / 2 - current * totalStep);
                if (!animate) {
                    // 临时关闭过渡以做无缝跳转
                    track.style.transition = 'none';
                    track.style.transform = `translateX(${offset}px)`;
                    // 强制回流
                    void track.offsetHeight;
                    // 恢复过渡
                    track.style.transition = 'transform 500ms ease';
                } else {
                    track.style.transform = `translateX(${offset}px)`;
                }
                updateIndicators();
            }

            // 在带克隆的 track 中移动
            function next(){ current = current + 1; updatePosition(true); }
            function prev(){ current = current - 1; updatePosition(true); }
            // goToReal：接受 0-based real index, 转为带前置 clone 的索引
            function goToReal(realIdx){ current = realIdx + 1; updatePosition(true); }

            function startTimer(){ timer = setInterval(next, autoplayInterval); }
            function resetTimer(){ if (timer) clearInterval(timer); startTimer(); }

            const nextBtn = document.getElementById('sl-next');
            const prevBtn = document.getElementById('sl-prev');
            if (nextBtn) nextBtn.addEventListener('click', ()=>{ next(); resetTimer(); });
            if (prevBtn) prevBtn.addEventListener('click', ()=>{ prev(); resetTimer(); });

            // 鼠标悬停暂停
            viewport.addEventListener('mouseenter', ()=> { if (timer) clearInterval(timer); });
            viewport.addEventListener('mouseleave', ()=> { resetTimer(); });

            // 监听 transitionend 以在到达克隆时无缝跳转到真实 slide
            track.addEventListener('transitionend', () => {
                // 当移动到最前面的克隆（index 0）时，跳转到真实最后一张（index = realCount）
                if (current === 0) {
                    current = realCount;
                    updatePosition(false);
                }
                // 当移动到最后面的克隆（index = realCount + 1）时，跳转到真实第一张（index = 1）
                if (current === realCount + 1) {
                    current = 1;
                    updatePosition(false);
                }
            });

            // 响应式：窗口尺寸变化时重新布局
            window.addEventListener('resize', () => { layoutSlides(); });

            // 首次布局并启动：把初始位置设为第一张(索引1)
            layoutSlides();
            updatePosition(false);
            startTimer();
        });
    </script>

        // 颜色数组用于生成不同的头像背景色
        const avatarColors = [
            { bg: 'bg-primary/10', text: 'text-primary' },
            { bg: 'bg-secondary/10', text: 'text-secondary' },
            { bg: 'bg-blue-100', text: 'text-blue-500' },

            { bg: 'bg-indigo-100', text: 'text-indigo-500' }
        ];

        // 渲染当前页的班级成员
        function renderClassMembers() {
            container.innerHTML = '';
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentMembers = classMembers.slice(startIndex, endIndex);

            currentMembers.forEach((member, index) => {
                const colorIndex = (startIndex + index) % avatarColors.length;
                const color = avatarColors[colorIndex];
                
                const memberCard = document.createElement('div');
                memberCard.className = 'bg-gray-50 rounded-lg p-6 border border-gray-200 hover:shadow-md transition-shadow';
                memberCard.innerHTML = `
                    <div class="flex items-center mb-4">
                        <div class="w-12 h-12 ${color.bg} rounded-full flex items-center justify-center ${color.text}">
                            <i class="fa fa-user text-xl"></i>
                        </div>
                        <h3 class="text-xl font-medium ml-4 text-gray-800">${member.name}</h3>
                    </div>
                    <p class="text-gray-600">${member.bio}</p>
                `;
                container.appendChild(memberCard);
            });

            updatePagination();
        }

        // 更新分页控件
        function updatePagination() {
            // 更新上一页/下一页按钮状态
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages;

            // 更新页码
            pageNumbersContainer.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `px-3 py-1 rounded-md text-sm ${i === currentPage ? 'bg-primary text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`;
                pageBtn.textContent = i;
                pageBtn.addEventListener('click', () => {
                    currentPage = i;
                    renderClassMembers();
                });
                pageNumbersContainer.appendChild(pageBtn);
            }
        }

        // 事件监听
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderClassMembers();
            }
        });

        nextPageBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderClassMembers();
            }
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', renderClassMembers);
    </script>
