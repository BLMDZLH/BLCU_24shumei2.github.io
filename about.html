<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我们 - We are 24树莓2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff4da6',
                        secondary: '#ff99cc',
                    },
                    fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .raspberry-pattern { background-image: radial-gradient(circle at 15% 25%, rgba(255,77,166,0.06) 0 5px, transparent 5px); }
        img { max-width: 100%; height: auto; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-white shadow-md py-4">
        <nav class="container mx-auto px-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa fa-book text-primary text-2xl"></i>
                <span class="text-xl font-bold text-primary">We are 24树莓2</span>
            </div>

            <div class="hidden md:flex items-center space-x-8">
                <a href="index.html" class="font-medium text-gray-600 hover:text-primary">首页</a>
                <a href="resources.html" class="font-medium text-gray-600 hover:text-primary">资源库</a>
                <a href="about.html" class="font-medium text-primary">关于我们</a>
            </div>

            <button id="mobile-menu-button" class="md:hidden text-gray-600 focus:outline-none"><i class="fa fa-bars text-xl"></i></button>
        </nav>

        <div id="mobile-menu" class="md:hidden hidden bg-white border-t">
            <div class="container mx-auto px-4 py-3 flex flex-col space-y-3">
                <a href="index.html" class="font-medium text-gray-600 py-2 px-4 rounded-md hover:bg-gray-50">首页</a>
                <a href="resources.html" class="font-medium text-gray-600 py-2 px-4 rounded-md hover:bg-gray-50">资源库</a>
                <a href="about.html" class="font-medium text-primary py-2 px-4 rounded-md bg-primary/10">关于我们</a>
            </div>
        </div>
    </header>

    <main class="flex-grow">
        <section class="bg-gradient-to-r from-primary to-secondary text-white py-12 raspberry-pattern">
            <div class="container mx-auto px-4">
                <h1 class="text-3xl md:text-4xl font-bold">关于我们</h1>
                <p class="mt-2 opacity-90">这是 We are 24树莓2 班级的简介与同学相册入口页。下面会展示班级同学的照片（暂未添加）。</p>
            </div>
        </section>

        <section class="py-12">
            <div class="container mx-auto px-4">
                <div class="bg-white rounded-xl shadow-card p-6">
                    <h2 class="text-2xl font-semibold mb-4">班级相册</h2>
                    <p class="text-gray-600 mb-6">同学照片将会出现在下面的网格中。目前照片尚未上传，页面以占位卡片展示。</p>

                    <!-- 占位网格 -->
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                        <!-- 12 placeholder cards -->
                        <!-- 用户可根据实际照片数量添加或替换这些卡片 -->
                        <template id="placeholder-card">
                            <div class="flex flex-col items-center p-4 bg-gray-50 border border-gray-200 rounded-lg">
                                <div class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center text-gray-400 text-xl"><i class="fa fa-user"></i></div>
                                <div class="mt-3 text-sm text-gray-600">照片暂未添加</div>
                            </div>
                        </template>

                        <!-- render placeholders via JS for neat markup -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // mobile menu accessibility + body lock
        (function(){
            const btn = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            if (btn && mobileMenu) {
                btn.setAttribute('aria-controls','mobile-menu');
                btn.setAttribute('aria-expanded','false');
                btn.addEventListener('click', function() {
                    const open = !mobileMenu.classList.contains('hidden');
                    mobileMenu.classList.toggle('hidden');
                    btn.setAttribute('aria-expanded', String(!open));
                    if (!open) document.body.classList.add('overflow-hidden'); else document.body.classList.remove('overflow-hidden');
                });
                window.addEventListener('resize', function(){ if (window.innerWidth >= 768) { mobileMenu.classList.add('hidden'); btn.setAttribute('aria-expanded','false'); document.body.classList.remove('overflow-hidden'); } });
            }
        })();

        // 填充占位卡片
        (function(){
            const grid = document.querySelector('.grid');
            const tpl = document.getElementById('placeholder-card');
            if (!grid || !tpl) return;
            for (let i=0;i<12;i++) {
                const node = tpl.content.cloneNode(true);
                grid.appendChild(node);
            }
        })();
    </script>
</body>
</html>
