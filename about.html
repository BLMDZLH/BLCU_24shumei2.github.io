    <script>
        // mobile menu accessibility + body lock
        (function(){ 
            const btn = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            if (btn && mobileMenu) {
                btn.setAttribute('aria-controls','mobile-menu');
                btn.setAttribute('aria-expanded','false');
                btn.addEventListener('click', function() {
                    const open = !mobileMenu.classList.contains('hidden');
                    mobileMenu.classList.toggle('hidden');
                    btn.setAttribute('aria-expanded', String(!open));
                    if (!open) document.body.classList.add('overflow-hidden'); else document.body.classList.remove('overflow-hidden');
                });
                window.addEventListener('resize', function(){ if (window.innerWidth >= 768) { mobileMenu.classList.add('hidden'); btn.setAttribute('aria-expanded','false'); document.body.classList.remove('overflow-hidden'); } });
            }
        })();
    </script>
    
    <!-- 鼠标粒子与点击显示图片（与 index 同步的实现） -->
    <style>
        #cursor-bubbles { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; overflow: visible; }
        .cursor-bubble { position: absolute; border-radius: 999px; will-change: transform, opacity; pointer-events: none; mix-blend-mode: screen; }
        .click-image-wrap { position: absolute; pointer-events: none; width:64px; height:64px; border-radius:50%; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.18); transform:translate(-50%,-50%) scale(1); transition: opacity 700ms ease, transform 700ms ease; opacity:1; z-index:10000; background:transparent }
        .click-image-wrap img { display:block; width:100%; height:100%; object-fit:cover; border:none; outline:none; background:transparent }
    </style>
    <!-- 移除图片处理相关代码，简化点击显示图片功能 -->
    <script>
        (function initCursorBubblesAbout(){
            if (document.getElementById('cursor-bubbles')) return; // 防止重复初始化
            const colors = ['rgba(255,77,166,0.95)','rgba(255,153,204,0.88)','rgba(102,178,255,0.9)','rgba(166,102,255,0.9)','rgba(34,197,94,0.9)'];
            const container = document.createElement('div'); container.id = 'cursor-bubbles'; document.body.appendChild(container);
            let lastSpawn = 0; const minInterval = 24;
            function spawnBubble(x,y){
                const el = document.createElement('div'); el.className='cursor-bubble';
                const size = Math.round(Math.random()*10)+6; const color = colors[Math.floor(Math.random()*colors.length)];
                const duration = Math.round(Math.random()*600)+900;
                el.style.left = x+'px'; el.style.top = y+'px'; el.style.width = size+'px'; el.style.height = size+'px'; el.style.background = color; el.style.opacity='1';
                el.style.transition = `transform ${duration}ms cubic-bezier(.2,.9,.3,1), opacity ${duration}ms ease-out`;
                el.style.transform='translate(-50%,-50%) scale(1)'; container.appendChild(el);
                requestAnimationFrame(()=>{ el.style.opacity='0'; el.style.transform='translate(-50%,-70%) scale(0.6)'; });
                setTimeout(()=>{ if(el&&el.parentNode) el.parentNode.removeChild(el); }, duration+60);
            }
            document.addEventListener('mousemove', function(e){ const now = Date.now(); if(now-lastSpawn>minInterval){ spawnBubble(e.clientX,e.clientY); spawnBubble(e.clientX+10,e.clientY+6); lastSpawn=now; } });
            document.addEventListener('touchmove', function(e){ const t=e.touches[0]; if(!t) return; const now=Date.now(); if(now-lastSpawn>minInterval){ spawnBubble(t.clientX,t.clientY); spawnBubble(t.clientX+10,t.clientY+6); lastSpawn=now; } }, {passive:true});

            // 简化的点击显示图片功能
            function showClickImageAtAbout(x,y){
                const wrap = document.createElement('div'); wrap.className='click-image-wrap';
                const img = document.createElement('img'); img.alt = '';
                const vw = Math.max(document.documentElement.clientWidth||0, window.innerWidth||0);
                const size = Math.min(64, Math.round(vw*0.08));
                wrap.style.width = size + 'px'; wrap.style.height = size + 'px';
                wrap.style.left = x + 'px'; wrap.style.top = y + 'px'; wrap.appendChild(img); document.body.appendChild(wrap);
                
                function startFade(){
                    requestAnimationFrame(()=>{ 
                        setTimeout(()=>{ 
                            wrap.style.opacity='0'; 
                            wrap.style.transform='translate(-50%,-70%) scale(1.08)'; 
                        },20); 
                    }); 
                    setTimeout(()=>{ if(wrap&&wrap.parentNode) wrap.parentNode.removeChild(wrap); },820); 
                }
                
                // 直接使用原始图片
                img.src='image/shumei.png';
                startFade();
            }
            
            document.addEventListener('click', function(e){ showClickImageAtAbout(e.clientX,e.clientY); });
            document.addEventListener('touchstart', function(e){ const t=e.touches[0]; if(!t) return; showClickImageAtAbout(t.clientX,t.clientY); }, {passive:true});
        })();
    </script>

            const currentMembers = classMembers.slice(startIndex, endIndex);

            currentMembers.forEach((member, index) => {
                const colorIndex = (startIndex + index) % avatarColors.length;
                const color = avatarColors[colorIndex];
                
                const memberCard = document.createElement('div');
                memberCard.className = 'bg-gray-50 rounded-lg p-6 border border-gray-200 hover:shadow-md transition-shadow';
                memberCard.innerHTML = `
                    <div class="flex items-center mb-4">
                        <div class="w-12 h-12 ${color.bg} rounded-full flex items-center justify-center ${color.text}">
                            <i class="fa fa-user text-xl"></i>
                        </div>
                        <h3 class="text-xl font-medium ml-4 text-gray-800">${member.name}</h3>
                    </div>
                    <p class="text-gray-600">${member.bio}</p>
                `;
                container.appendChild(memberCard);
            });

            updatePagination();
        }

        // 更新分页控件
        function updatePagination() {
            // 更新上一页/下一页按钮状态
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages;

            // 更新页码
            pageNumbersContainer.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `px-3 py-1 rounded-md text-sm ${i === currentPage ? 'bg-primary text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`;
                pageBtn.textContent = i;
                pageBtn.addEventListener('click', () => {
                    currentPage = i;
                    renderClassMembers();
                });
                pageNumbersContainer.appendChild(pageBtn);
            }
        }

        // 事件监听
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderClassMembers();
            }
        });

        nextPageBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderClassMembers();
            }
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', renderClassMembers);
    </script>

</body>
</html>
